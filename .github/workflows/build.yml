name: Desktop validation and offline packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: win, arch: x64, runner: windows-2025}
          - {platform: win, arch: arm64, runner: windows-11-arm}
          - {platform: mac, arch: x64, runner: macos-15-intel}
          - {platform: mac, arch: arm64, runner: macos-15}
          - {platform: linux, arch: x64, runner: ubuntu-24.04}
          - {platform: linux, arch: arm64, runner: ubuntu-24.04-arm}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require native Node runtime
        run: node -e 'require("node:assert/strict").equal(process.arch, process.argv[1])' ${{ matrix.arch }}
      - run: npm ci
      - run: npm test
      - if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - run: npm run build
      - name: Build self-contained packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Prepare Linux desktop libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth desktop-file-utils libgtk-3-0t64 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0t64 libuuid1 libsecret-1-0 libasound2t64
      - name: Accept Windows offline packages
        if: matrix.platform == 'win'
        shell: pwsh
        timeout-minutes: 9
        run: ./tests/accept-windows.ps1 -Arch ${{ matrix.arch }} -Evidence acceptance
      - name: Accept macOS and Linux offline packages
        if: matrix.platform != 'win'
        timeout-minutes: 9
        run: bash tests/accept-unix.sh ${{ matrix.platform }} ${{ matrix.arch }} "$PWD/acceptance"
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: acceptance-${{ matrix.platform }}-${{ matrix.arch }}
          path: acceptance/
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Margin-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          compression-level: 0
