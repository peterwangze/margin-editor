name: Desktop validation and offline packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: win, arch: x64, runner: windows-2025}
          - {platform: win, arch: arm64, runner: windows-11-arm}
          - {platform: mac, arch: x64, runner: macos-15-intel}
          - {platform: mac, arch: arm64, runner: macos-15}
          - {platform: linux, arch: x64, runner: ubuntu-24.04}
          - {platform: linux, arch: arm64, runner: ubuntu-24.04-arm}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require native Node runtime
        run: node -e 'require("node:assert/strict").equal(process.arch, process.argv[1])' ${{ matrix.arch }}
      - run: npm ci
      - run: npm test
      - if: matrix.platform == 'linux' && matrix.arch == 'x64'
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
      - run: npm run build
      - name: Build self-contained packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }}
      - name: Prepare Linux desktop libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth desktop-file-utils libgtk-3-0t64 libnotify4 libnss3 libxss1 libxtst6 xdg-utils libatspi2.0-0t64 libuuid1 libsecret-1-0 libasound2t64
      - name: Accept Windows offline packages
        if: matrix.platform == 'win'
        shell: pwsh
        timeout-minutes: 12
        run: ./tests/accept-windows.ps1 -Arch ${{ matrix.arch }} -Evidence acceptance
      - name: Accept macOS and Linux offline packages
        if: matrix.platform != 'win'
        timeout-minutes: 9
        run: bash tests/accept-unix.sh ${{ matrix.platform }} ${{ matrix.arch }} "$PWD/acceptance"
      - name: Build earlier version for native upgrade acceptance
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          set -euo pipefail
          manifest=$(mktemp)
          cp package.json "$manifest"
          trap 'cp "$manifest" package.json; rm -f -- "$manifest"' EXIT
          node -e 'const fs = require("node:fs"); const manifest = require("./package.json"); manifest.version = "1.6.99"; fs.writeFileSync("package.json", JSON.stringify(manifest, null, 2) + "\n")'
          npm run build
          extra=()
          if [[ "${{ matrix.platform }}" == mac ]]; then extra+=(--dir); fi
          npm run package -- --${{ matrix.platform }} --${{ matrix.arch }} --config.directories.output=release/upgrade-baseline "${extra[@]}"
      - name: Accept upgrade and restart from the candidate packages
        timeout-minutes: 11
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json package-lock.json
          case "${{ matrix.platform }}" in
            win)
              status=0
              node tests/accept-upgrade.mjs setup || status=1
              node tests/accept-upgrade.mjs portable || status=1
              exit "$status"
              ;;
            mac)
              node tests/accept-upgrade.mjs dmg
              ;;
            linux)
              sudo unshare --net bash -c '
                ip link set lo up || exit
                status=0
                runuser -u "$1" -- xvfb-run -a "$2" tests/accept-upgrade.mjs deb || status=1
                runuser -u "$1" -- xvfb-run -a "$2" tests/accept-upgrade.mjs appimage || status=1
                exit "$status"
              ' bash "$(id -un)" "$(command -v node)"
              ;;
          esac
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: acceptance-${{ matrix.platform }}-${{ matrix.arch }}
          path: acceptance/
          if-no-files-found: ignore
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: Margin-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          compression-level: 0
