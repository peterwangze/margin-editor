name: Publish verified offline packages

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful desktop build run for this commit
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: margin-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify build identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          gh run view "$BUILD_RUN" --json conclusion,headSha,workflowName | jq -e --arg sha "$GITHUB_SHA" '.conclusion == "success" and .headSha == $sha and .workflowName == "Desktop validation and offline packages"'
          gh run download "$BUILD_RUN" --pattern 'Margin-*' --dir verified
      - name: Verify manifest and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          for platform in win mac linux; do
            for arch in x64 arm64; do
              [[ $(find "verified/Margin-$platform-$arch" -maxdepth 1 -type f | wc -l) == 2 ]]
            done
          done
          mkdir packages
          find verified -type f -exec cp -n '{}' packages/ \;
          cd packages
          [[ $(find . -maxdepth 1 -type f | wc -l) == 12 ]]
          sha256sum -- * > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          cd ..
          cp docs/release-notes.md release-notes.txt
          printf '\n[Platform build and acceptance logs](https://github.com/%s/actions/runs/%s)\n' "$GITHUB_REPOSITORY" "$BUILD_RUN" >> release-notes.txt
          if gh release view "v$version" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            [[ $(cat draft.txt) == true ]]
          else
            gh release create "v$version" --target "$GITHUB_SHA" --title "Margin $version" --draft --prerelease --notes-file release-notes.txt
          fi
          gh release upload "v$version" packages/* --clobber
          [[ $(gh release view "v$version" --json assets --jq '.assets | length') == 13 ]]
          gh release edit "v$version" --draft=false
